name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and omniORB
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ omniidl libomniorb4-dev omniorb-nameserver libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Demo with Naming Service
        run: TELEMETRY_BIN=$PWD/build DEMO_SECONDS=3 scripts/demo.sh --naming --check
